backend:
  name: github
  repo: inusushi/inusushi.github.io
  branch: main
  base_url: https://inusushi-cms-auth.vercel.app
  auth_endpoint: auth

media_folder: "fotos"
public_folder: "/fotos"

collections:
  - name: "config"
    label: "Configuración del sitio"
    files:
      - name: "site-data"
        label: "Horario, descuento y avisos"
        file: "data/site-data.json"
        format: "json"
        fields:
          - label: "Horario"
            name: "horario"
            widget: "object"
            fields:
              - label: "Días abiertos"
                name: "dias"
                widget: "select"
                multiple: true
                hint: "Elige los días en que el negocio recibe pedidos por la web"
                default: [5, 6, 0]
                options:
                  - {label: "Domingo", value: 0}
                  - {label: "Lunes", value: 1}
                  - {label: "Martes", value: 2}
                  - {label: "Miércoles", value: 3}
                  - {label: "Jueves", value: 4}
                  - {label: "Viernes", value: 5}
                  - {label: "Sábado", value: 6}
              - {label: "Hora de apertura (0-23)", name: "abre", widget: "number", min: 0, max: 23, value_type: "int"}
              - {label: "Hora de cierre (0-23)", name: "cierra", widget: "number", min: 0, max: 23, value_type: "int"}
          - label: "Descuento por compra web"
            name: "descuento_web"
            widget: "object"
            fields:
              - {label: "Activo", name: "activo", widget: "boolean"}
              - {label: "Porcentaje", name: "porcentaje", widget: "number", min: 0, max: 100, value_type: "int"}
          - label: "Banner de aviso"
            name: "banner_aviso"
            widget: "object"
            fields:
              - {label: "Activo", name: "activo", widget: "boolean"}
              - {label: "Texto del aviso", name: "texto", widget: "string", required: false}

  - name: "promos"
    label: "Promoción del día/semana"
    files:
      - name: "promos-data"
        label: "Promociones"
        file: "data/promos.json"
        format: "json"
        fields:
          - label: "Promociones"
            name: "promos"
            widget: "list"
            summary: "{{nombre}} — {{activo}}"
            fields:
              - {label: "Nombre", name: "nombre", widget: "string"}
              - {label: "Texto promocional", name: "texto", widget: "text"}
              - {label: "Imagen", name: "imagen", widget: "image"}
              - {label: "Precio", name: "precio", widget: "number", value_type: "int"}
              - {label: "Activa", name: "activo", widget: "boolean", default: false}
